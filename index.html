<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo C++</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<link rel="preconnect" href="https://v8.js-dos.com" crossorigin>
<link rel="preload" href="https://v8.js-dos.com/latest/emulators/emulators.js" as="script" crossorigin>
<link rel="preload" href="https://v8.js-dos.com/latest/js-dos.js" as="script" crossorigin>

<style>
  :root { color-scheme: dark; min-height: 100%; background: #101114; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html { min-height: 100%; background: #101114; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; width: 100%; background: #101114; color: #e8e9ed; font: 15px/1.5 system-ui, sans-serif; }
  .shell { width: 100%; min-height: 100vh; min-height: 100dvh; max-width: 1120px; margin: 0 auto; padding: 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; background: #1b1d22; border: 1px solid #30333b; border-radius: 12px 12px 0 0; }
  .bar-label { font-weight: 700; margin: 0 auto 0 4px; }
  button, select { font: inherit; }
  button { color: inherit; background: #292c33; border: 1px solid #424650; padding: 8px 13px; border-radius: 7px; cursor: pointer; }
  button:hover:not(:disabled) { background: #373b44; }
  button:disabled { opacity: .5; cursor: wait; }
  button.primary { background: #315cba; border-color: #4775d4; }
  button.primary:hover:not(:disabled) { background: #3c6bd0; }
  button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid #8bb4ff; outline-offset: 2px; }
  .icon-button { position: relative; display: grid; place-items: center; width: 42px; height: 42px; padding: 0; }
  .icon-button img { display: block; width: 21px; height: 21px; }
  .icon-button img.white-icon { filter: brightness(0) invert(1); }
  .save-indicator { position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border: 1.5px solid #1b1d22; border-radius: 50%; opacity: 0; }
  #save[data-save-state="success"] .save-indicator { background: #38d98a; opacity: 1; }
  #save[data-save-state="error"] .save-indicator { background: #ff5263; opacity: 1; }
  #screen { position: relative; overflow: hidden; min-height: 360px; border: 1px solid #30333b; border-top: 0; border-radius: 0 0 12px 12px; background: #000; }
  #screen.touch-cursor-mode { touch-action: none; }
  #screen:focus { outline: 2px solid #8bb4ff; outline-offset: 2px; }
  #screen.pointer-captured:focus { outline: 0; }
  #screen.pointer-captured, #screen.pointer-captured * { cursor: none !important; }
  #dos .pointer-events-none:has(.text-xl) { display: none !important; }
  .screen-overlay { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; padding: 0; background: rgb(8 9 12 / .92); color: #fff; text-align: center; }
  .screen-overlay.fullscreen-overlay { position: fixed; z-index: 2147483647; inset: 0; }
  .screen-overlay[hidden], .screen-overlay [hidden] { display: none !important; }
  .loading-state, .capture-overlay { display: grid; justify-items: center; align-content: center; gap: 10px; width: 100%; height: 100%; padding: 0; }
  .loading-state span:last-child, .capture-overlay span { color: #b9bdc8; font-size: 13px; }
  .capture-overlay { border: 0; border-radius: 0; background: transparent; color: #fff; text-align: center; cursor: pointer; }
  .capture-overlay strong { font-size: clamp(16px, 2.5vw, 22px); }
  .loading-spinner { width: 34px; height: 34px; border: 3px solid #454a55; border-top-color: #8bb4ff; border-radius: 50%; animation: loading-spin .8s linear infinite; }
  @keyframes loading-spin { to { transform: rotate(360deg); } }
  #dos { width: 100%; height: min(62vh, 640px); min-height: 360px; margin: 0 auto; }
  #dos:empty { display: none; }
  #dos .sidebar, #dos .sidebar-thin, #dos .sidebar-slider, #dos .w-2.flex-shrink-0 { display: none !important; }
  .touch-keys { margin-top: 12px; border: 1px solid #30333b; border-radius: 10px; background: #1b1d22; }
  .touch-keys summary { padding: 11px 14px; cursor: pointer; font-weight: 600; touch-action: manipulation; }
  .keypad { padding: 8px; display: grid; gap: 5px; overflow-x: hidden; }
  .key-row { display: flex; gap: 4px; justify-content: flex-start; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }
  .key-row button { min-width: 40px; min-height: 46px; flex: 0 0 40px; padding: 5px 3px; font-size: 13px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .key-row button.wide { flex-basis: 64px; }
  .key-row button.space { flex: 1 0 180px; }
  .key-row button.double-label { display: grid; grid-template-rows: 1fr 1fr; align-items: center; line-height: 1; padding: 4px; }
  .key-row button.double-label span:first-child { justify-self: start; align-self: start; color: #aeb4c0; font-size: 10px; }
  .key-row button.double-label span:last-child { justify-self: center; align-self: end; }
  .key-row button.active { background: #315cba; border-color: #8bb4ff; }
  .key-row.function-row button { flex-basis: 44px; }
  .key-row button:active { background: #3c6bd0; }
  .touch-keys.native-mode .keyboard-text-row { display: none; }
  .touch-keys.native-mode [data-special-row] { display: flex; }
  .native-keyboard-open { display: none; width: 48px; height: 48px; margin: 8px; padding: 0; place-items: center; }
  .native-keyboard-open img { display: block; width: 24px; height: 24px; filter: brightness(0) invert(1); }
  .touch-keys.native-mode { position: relative; }
  .touch-keys.native-mode summary { min-height: 24px; height: 24px; padding: 0 8px; }
  .touch-keys.native-mode .native-keyboard-open { position: absolute; z-index: 1; top: 4px; right: 8px; display: grid; width: 36px; height: 36px; margin: 0; }
  .touch-keys.native-mode .native-keyboard-open img { width: 20px; height: 20px; }
  @media (pointer: fine) {
    .keypad { width: 880px; max-width: 100%; margin-inline: auto; gap: 5px; }
    .key-row { width: 100%; align-items: center; justify-content: center; gap: 4px; overflow-x: auto; }
    .key-row button { flex-basis: 44px; min-height: 46px; font-size: 14px; }
    .key-row button.wide { flex-basis: 72px; }
    .key-row button.space { flex: 0 0 210px; }
    .key-row.function-row button { flex-basis: 44px; }
    .key-row.function-row button:nth-child(6), .key-row.function-row button:nth-child(10) { margin-left: 10px; }
    .key-row.function-row [data-key="260"] { margin-left: 20px; }
    .arrow-cluster { display: flex; gap: 4px; }
    .arrow-cluster button { min-width: 44px; min-height: 46px; padding: 4px; }
    .keypad > .pc-bottom-row { justify-content: center; }
    .keypad > .key-row[data-special-row]:not(.function-row) { display: none; }
    .key-row button:disabled { opacity: .78; }
  }
  @media (pointer: coarse) { [data-pc-row], [data-pc-key] { display: none; } }
  dialog { width: min(460px, calc(100% - 28px)); padding: 0; color: #e8e9ed; background: #1b1d22; border: 1px solid #424650; border-radius: 10px; }
  dialog::backdrop { background: rgb(0 0 0 / .65); }
  .settings-head, .settings-body { padding: 16px; }
  .settings-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #424650; }
  .settings-head h2 { margin: 0; font-size: 18px; }
  .settings-head button { display: grid; place-items: center; width: 36px; height: 36px; padding: 0; line-height: 0; }
  .settings-head button img { display: block; width: 18px; height: 18px; }
  .setting { display: grid; gap: 6px; margin-bottom: 16px; }
  .setting select { width: 100%; min-height: 42px; padding: 8px; color: #e8e9ed; background: #292c33; border: 1px solid #555b68; border-radius: 6px; }
  .range-setting { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; background: #292c33; border: 1px solid #555b68; border-radius: 6px; }
  .range-setting input { flex: 1; min-width: 0; accent-color: #8bb4ff; }
  .range-setting output { min-width: 42px; color: #cbd8f2; font-variant-numeric: tabular-nums; text-align: right; }
  .toggle-setting { display: flex; align-items: center; gap: 10px; min-height: 46px; margin-bottom: 16px; }
  .toggle-setting input { width: 20px; height: 20px; accent-color: #8bb4ff; }
  .phone-only-setting { display: none; }
  .settings-done { width: 100%; min-height: 42px; background: #315cba; border-color: #4775d4; }
  .native-keyboard-input { position: fixed; z-index: 1; left: 50%; top: 50%; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none; font-size: 16px; resize: none; caret-color: transparent; -webkit-user-select: text; user-select: text; }
  .input-toast { position: fixed; z-index: 1000; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 12px); max-width: calc(100vw - 32px); padding: 12px 18px; color: #fff; background: #202329; border: 1px solid #535b69; border-radius: 8px; box-shadow: 0 8px 30px rgb(0 0 0 / .45); text-align: center; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
  .input-toast.visible { opacity: 1; transform: translate(-50%, 0); }
  .esc-hint { position: fixed; z-index: 1000; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); padding: 8px 12px; color: #cdd3de; background: rgb(32 35 41 / .88); border: 1px solid #535b69; border-radius: 8px; font-size: 12px; line-height: 1.4; text-align: right; pointer-events: none; }
  .esc-hint kbd { display: inline-block; min-width: 18px; padding: 1px 5px; color: #fff; background: #373b44; border: 1px solid #5a6270; border-radius: 4px; font: 11px/1.5 system-ui, sans-serif; text-align: center; }
  .esc-hint[hidden] { display: none !important; }
  @media (pointer: coarse) {
    #fullscreen { display: none; }
    [data-special-row] { display: none; }
    .desktop-only-setting { display: none; }
    .phone-only-setting { display: flex; }
  }
  @media (max-width: 620px) {
    .shell { padding: 10px; }
    .bar { gap: 7px; padding: 9px; }
    .bar button { min-height: 42px; padding: 7px 9px; }
    #screen { min-height: 240px; }
    #dos { min-height: 240px; height: 42vh; }
    #fullscreen { display: none; }
    .touch-keys { margin-top: 8px; }
    .touch-keys summary { min-height: 48px; display: flex; align-items: center; }
    .keypad { padding: 8px 6px calc(10px + env(safe-area-inset-bottom)); gap: 7px; }
    .key-row { gap: 6px; }
    .key-row button { min-height: 50px; flex-basis: 42px; font-size: 14px; }
    .key-row button.wide { flex-basis: 68px; }
    .key-row.function-row button { flex-basis: 46px; }
    .key-row button.space { min-height: 52px; }
  }
</style>
</head>
<body>
<main class="shell">
  <div class="bar" role="toolbar" aria-label="Turbo C++ controls">
    <span class="bar-label">Turbo C++</span>

      <img src="./assets/icons/fullscreen.svg" alt="">

  <div id="input-toast" class="input-toast" role="status" aria-live="polite" hidden></div>
<div id="esc-hint" class="esc-hint" aria-hidden="true" hidden><kbd>Esc</kbd> release mouse · <kbd>Ctrl</kbd>+<kbd>`</kbd> send ESC</div>
  <details id="touch-keys" class="touch-keys">
    <summary aria-label="Toggle on-screen keyboard"></summary>
    <button id="native-keyboard-open" class="native-keyboard-open" type="button" aria-label="Open phone keyboard">
      <img src="./assets/icons/keyboard.svg" alt="">

    <div class="keypad" aria-label="Turbo C++ touch keyboard">
      <div class="key-row function-row keyboard-text-row" data-special-row>
        <button data-key="256" disabled>Esc</button><button data-key="290" disabled>F1</button><button data-key="291" disabled>F2</button><button data-key="292" disabled>F3</button><button data-key="293" disabled>F4</button>
        <button data-key="294" disabled>F5</button><button data-key="295" disabled>F6</button><button data-key="296" disabled>F7</button><button data-key="297" disabled>F8</button>
        <button data-key="298" disabled>F9</button><button data-key="299" disabled>F10</button>
        <button class="pc-nav-key" data-key="260" data-pc-key disabled>Ins</button><button class="pc-nav-key" data-key="261" data-pc-key disabled>Del</button><button class="pc-nav-key" data-key="268" data-pc-key disabled>Home</button><button class="pc-nav-key" data-key="269" data-pc-key disabled>End</button><button class="pc-nav-key" data-key="266" data-pc-key disabled>PgUp</button><button class="pc-nav-key" data-key="267" data-pc-key disabled>PgDn</button>
      </div>
      <div class="key-row keyboard-text-row">
        <button class="double-label" data-key="96" disabled><span>~</span><span>`</span></button><button class="double-label" data-key="49" disabled><span>!</span><span>1</span></button><button class="double-label" data-key="50" disabled><span>@</span><span>2</span></button><button class="double-label" data-key="51" disabled><span>#</span><span>3</span></button><button class="double-label" data-key="52" disabled><span>$</span><span>4</span></button><button class="double-label" data-key="53" disabled><span>%</span><span>5</span></button><button class="double-label" data-key="54" disabled><span>^</span><span>6</span></button><button class="double-label" data-key="55" disabled><span>&amp;</span><span>7</span></button><button class="double-label" data-key="56" disabled><span>*</span><span>8</span></button><button class="double-label" data-key="57" disabled><span>(</span><span>9</span></button><button class="double-label" data-key="48" disabled><span>)</span><span>0</span></button><button class="double-label" data-key="45" disabled><span>_</span><span>-</span></button><button class="double-label" data-key="61" disabled><span>+</span><span>=</span></button><button class="wide" data-key="259" disabled>Backspace</button>
      </div>
      <div class="key-row keyboard-text-row">
        <button class="wide" data-key="258" disabled>Tab</button><button data-key="81" disabled>Q</button><button data-key="87" disabled>W</button><button data-key="69" disabled>E</button><button data-key="82" disabled>R</button><button data-key="84" disabled>T</button><button data-key="89" disabled>Y</button><button data-key="85" disabled>U</button><button data-key="73" disabled>I</button><button data-key="79" disabled>O</button><button data-key="80" disabled>P</button><button class="double-label" data-key="91" disabled><span>{</span><span>[</span></button><button class="double-label" data-key="93" disabled><span>}</span><span>]</span></button><button class="double-label" data-key="92" disabled><span>|</span><span>\</span></button>
      </div>
      <div class="key-row keyboard-text-row">
        <button data-key="65" disabled>A</button><button data-key="83" disabled>S</button><button data-key="68" disabled>D</button><button data-key="70" disabled>F</button><button data-key="71" disabled>G</button><button data-key="72" disabled>H</button><button data-key="74" disabled>J</button><button data-key="75" disabled>K</button><button data-key="76" disabled>L</button><button class="double-label" data-key="59" disabled><span>:</span><span>;</span></button><button class="double-label" data-key="39" disabled><span>&quot;</span><span>'</span></button><button class="wide" data-key="257" disabled>Enter</button>

</main>
<dialog id="settings-panel" aria-labelledby="settings-title">
  <div class="settings-head">
    <h2 id="settings-title">Settings</h2>
    <button id="settings-close" type="button" aria-label="Close settings" title="Close settings"><img src="./assets/icons/close.svg" alt=""></button>
  </div>
  <div class="settings-body">
    <label class="setting" for="aspect-setting">Display aspect
      <select id="aspect-setting">
        <option value="AsIs">Native</option>
        <option value="4/3">4:3</option>
        <option value="16/9">16:9</option>
        <option value="Fit">Fit screen</option>
      </select>
    </label>
    <label class="setting" for="render-setting">Image rendering
      <select id="render-setting">
        <option value="pixelated">Sharp pixels</option>
        <option value="smooth">Smooth</option>
      </select>
    </label>
    <label class="toggle-setting phone-only-setting" for="native-keyboard-setting">
      <input id="native-keyboard-setting" type="checkbox">
      <span>Use native on-screen keyboard on phones</span>
    </label>
    <label class="toggle-setting phone-only-setting" for="touch-cursor-setting">
      <input id="touch-cursor-setting" type="checkbox">
      <span>Use drag-to-move cursor on phones</span>
    </label>
    <label class="toggle-setting desktop-only-setting" for="desktop-keyboard-setting">
      <input id="desktop-keyboard-setting" type="checkbox">
      <span>Show on-screen keyboard on PC</span>
    </label>
    <label class="setting" for="mouse-sensitivity-setting">Mouse sensitivity
      <span class="range-setting">
        <input id="mouse-sensitivity-setting" type="range" min="0" max="1" step="0.01">
        <output id="mouse-sensitivity-value" for="mouse-sensitivity-setting">50%</output>
      </span>
    </label>
    <button id="settings-done" class="settings-done" type="button">Done</button>
  </div>
</dialog>
<textarea id="native-keyboard-input" class="native-keyboard-input" aria-label="Type into Turbo C++" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text"></textarea>
<script>
(() => {
const el = id => document.getElementById(id);
let player = null;
let ci = null;
const desktopPointer = matchMedia("(pointer: fine)").matches;
let pointerWasCaptured = false;
let toastTimer = 0;
let escapeHoldTimer = 0;
let escapeHoldAvailable = false;
let escapeReleaseTriggered = false;
let escapeDownSent = false;
let wheelRemainder = 0;
const bundleUrl = "./turboc.jsdos?v=5";
const changesKey = "turbo-c-project-files-v5.changes";
try {
  if (localStorage.getItem(changesKey) === null) {
    const legacy = localStorage.getItem("turbo-c-project-files-v3.changes");
    if (legacy !== null) localStorage.setItem(changesKey, legacy);
  }
} catch {}
const aspectValues = ["AsIs", "4/3", "16/9", "Fit"];
const renderValues = ["pixelated", "smooth"];
const getSetting = key => {
  try { return localStorage.getItem("turbo-c-" + key); } catch { return null; }
};
const setSetting = (key, value) => {
  try { localStorage.setItem("turbo-c-" + key, String(value)); } catch {}
};
const storedSensitivity = getSetting("mouse-sensitivity");
const parsedSensitivity = storedSensitivity === null ? 0.5 : Number(storedSensitivity);
let sensitivityPref = Number.isFinite(parsedSensitivity) && parsedSensitivity >= 0 && parsedSensitivity <= 1 ? parsedSensitivity : 0.5;
const storedAspect = getSetting("aspect");
const storedRender = getSetting("render");
let aspectPref = aspectValues.includes(storedAspect) ? storedAspect : "AsIs";
let renderPref = renderValues.includes(storedRender) ? storedRender : "pixelated";
const storedNativeKeyboard = getSetting("native-keyboard");
let nativeKeyboardPref = storedNativeKeyboard === null ? true : storedNativeKeyboard === "true";
let touchCursorPref = getSetting("touch-cursor") === "true";
let desktopKeyboardPref = getSetting("desktop-keyboard") === "true";
const phoneLayout = matchMedia("(pointer: coarse)");
const touchKeys = el("touch-keys");
let touchCursorPointerId = null;
let touchCursorLastX = 0;
let touchCursorLastY = 0;
let touchCursorStartX = 0;
let touchCursorStartY = 0;
let touchCursorMoved = false;
const applyTouchCursorMode = () => {
  const enabled = phoneLayout.matches && touchCursorPref;
  el("screen").classList.toggle("touch-cursor-mode", enabled);
  el("touch-cursor-setting").checked = touchCursorPref;
  if (!enabled) {
    if (touchCursorPointerId !== null && ci) ci.sendMouseButton(0, false);
    touchCursorPointerId = null;
    touchCursorMoved = false;
  }
};
const applyKeyboardMode = () => {
  const nativeMode = phoneLayout.matches && nativeKeyboardPref;
  touchKeys.hidden = !phoneLayout.matches && !desktopKeyboardPref;
  touchKeys.classList.toggle("native-mode", nativeMode);
  el("native-keyboard-setting").checked = nativeKeyboardPref;
  el("desktop-keyboard-setting").checked = desktopKeyboardPref;
};
el("aspect-setting").value = aspectPref;
el("render-setting").value = renderPref;
el("mouse-sensitivity-setting").value = String(sensitivityPref);
el("mouse-sensitivity-value").value = Math.round(sensitivityPref * 100) + "%";
applyKeyboardMode();

addEventListener("pagehide", resetInputState);
document.addEventListener("visibilitychange", () => { if (document.hidden) resetInputState(); });

if (phoneLayout.matches || desktopKeyboardPref) touchKeys.open = true;
phoneLayout.addEventListener("change", () => {
  applyKeyboardMode();
  applyTouchCursorMode();
  if (phoneLayout.matches || desktopKeyboardPref) touchKeys.open = true;
});

el("fullscreen").onclick = () => {
  if (!player) return;
  player.setFullScreen(true);
};

el("restart").onclick = async () => {
  if (!player) return;
  try { await player.save(); } catch {}
  await run();
};

el("save").onclick = async () => {
  if (!player) return;
  try {
    await player.save();
    setSaveStatus("success");
  } catch (e) {
    setSaveStatus("error");
  }
};

start();
})();
</script>
</body>
</html>
